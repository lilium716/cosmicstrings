[package]
name = "cosmicstrings"
version = "0.1.0"
edition = "2024"

[dependencies]
num-complex = "0.4"
rayon = "1"
# tensor4all-rs は crates.io 未公開のため git 依存。再現性のためコミットを固定している。
tensor4all-quanticstci = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "25420b44e00897749ce06f7fe5bb0dbb62923fba" }
tensor4all-simplett = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "25420b44e00897749ce06f7fe5bb0dbb62923fba" }
# tenferro-rs（tensor4all のテンソル計算と自動微分）。tensor4all-rs が使うのと同じコミットに固定する
tenferro-ad = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "278ff65743fda720f70d7aaeb5c9d814cc51d8b5" }
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "278ff65743fda720f70d7aaeb5c9d814cc51d8b5" }
tenferro-runtime = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "278ff65743fda720f70d7aaeb5c9d814cc51d8b5" }
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "278ff65743fda720f70d7aaeb5c9d814cc51d8b5" }
